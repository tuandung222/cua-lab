name: writing-local-dev

services:
  writing-local-dev:
    container_name: writing-local-dev
    build:
      context: ./envs
      dockerfile: unified/Dockerfile
    image: writing-local-dev:0.1
    ports:
      - "127.0.0.1:18001:8001"
      - "127.0.0.1:18002:8002"
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:6081:6081"
    shm_size: "2gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://127.0.0.1:8001/health && curl -fsS http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 20
